<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例页 · 杯测笔记</title>
<style>
  :root { --bg: #FAF8F4; --fg: #22201C; --fg2: #6B665D; --line: #DDD7CC; --accent: #9A5B1E; --card: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171512; --fg: #ECE7DE; --fg2: #A39C90; --line: #38332B; --accent: #E0A35A; --card: #1F1C18; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.75 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 56px 24px 120px; }
  h1 { font-size: 34px; line-height: 1.3; margin: 0 0 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; } .card h3 { margin: 0 0 6px; font-size: 17px; } .card p { margin: 0; color: var(--fg2); font-size: 15px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>杯测笔记</h1>
  <div class="cards">
    <div class="card"><h3>W12-01</h3><p>茉莉花、柠檬皮。尾段有点涩，可能是发展不足。</p></div>
    <div class="card"><h3>W12-02</h3><p>蜂蜜、白桃。这一锅最平衡，作为下周的基准。</p></div>
    <div class="card"><h3>W12-03</h3><p>焦糖、杏。口感厚，但前段香气不如前两锅。</p></div>
    <div class="card"><h3>W12-05</h3><p>蓝莓、红酒。日晒味干净，没有过度发酵感。</p></div>
  </div>
  <p style="margin-top:44px"><a href="index.html">← 回到周报</a></p>
</main>
</body>
</html>
